<svg viewBox="0 0 420 96" xmlns="http://www.w3.org/2000/svg" width="420" height="96" role="img" aria-label="NexFiscal Skills">
  <!-- Logo oficial de NexFiscal Skills. Sobre papel de marca (#F4F1EA) para que
       sea legible en los temas claro y oscuro de GitHub. Isotipo: dos flechas
       opuestas con punto oro — mismo trazo que la landing y los creativos. -->
  <rect width="420" height="96" rx="12" fill="#F4F1EA"/>
  <rect x="0" y="0" width="420" height="5" rx="2.5" fill="#15346B"/>
  <rect x="294" y="0" width="126" height="5" rx="2.5" fill="#B8956A"/>
  <g transform="translate(28, 22) scale(0.9)">
    <line x1="0" y1="14" x2="44" y2="14" stroke="#15346B" stroke-width="6" stroke-linecap="square"/>
    <polyline points="36,6 44,14 36,22" stroke="#15346B" stroke-width="6" fill="none" stroke-linejoin="miter" stroke-linecap="square"/>
    <line x1="52" y1="42" x2="8" y2="42" stroke="#15346B" stroke-width="6" stroke-linecap="square"/>
    <polyline points="16,34 8,42 16,50" stroke="#15346B" stroke-width="6" fill="none" stroke-linejoin="miter" stroke-linecap="square"/>
    <circle cx="26" cy="28" r="5" fill="#B8956A"/>
  </g>
  <text x="98" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#0A1628" letter-spacing="-0.5">Nex<tspan font-style="italic" font-weight="400" fill="#15346B">Fiscal</tspan></text>
  <text x="98" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#B8956A">Skills</text>
</svg>
